# Geliştirme / yerel yığın. Sırlar ../.env dosyasından gelir (bkz. ../.env.example).
# Üretim için: ../docker-compose.prod.yml
services:
  postgres:
    image: postgres:16-alpine
    container_name: nizamlar-cms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-directus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlı olmalı}
      POSTGRES_DB: ${POSTGRES_DB:-nizamlar_cms_db}
    ports:
      - "127.0.0.1:5433:5432"   # yalnızca yerel makine
    volumes:
      - nizamlar_cms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-directus} -d ${POSTGRES_DB:-nizamlar_cms_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  directus:
    image: directus/directus:12.5.0
    container_name: nizamlar-cms-directus
    restart: unless-stopped
    ports:
      - "127.0.0.1:8055:8055"   # yalnızca yerel makine; dış erişim Express/Nginx üzerinden
    environment:
      KEY: ${DIRECTUS_KEY:?DIRECTUS_KEY .env içinde tanımlı olmalı}
      SECRET: ${DIRECTUS_SECRET:?DIRECTUS_SECRET .env içinde tanımlı olmalı}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      DB_CLIENT: "pg"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-nizamlar_cms_db}
      DB_USER: ${POSTGRES_USER:-directus}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      PUBLIC_URL: ${PUBLIC_SITE_URL:-http://localhost:3030}
      CORS_ENABLED: "true"
      CORS_ORIGIN: ${PUBLIC_SITE_URL:-http://localhost:3030}
      CORS_METHODS: "GET,POST,PATCH,PUT,DELETE,OPTIONS"
      CORS_ALLOWED_HEADERS: "Content-Type,Authorization"
      CORS_CREDENTIALS: "true"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      STORAGE_LOCATIONS: "local"
      STORAGE_LOCAL_ROOT: "/directus/uploads"
      STORAGE_LOCAL_DRIVER: "local"
      MAX_PAYLOAD_SIZE: "50mb"
      FILES_MAX_UPLOAD_SIZE: "50mb"
      FILES_MIME_TYPE_ALLOW_LIST: "image/*,application/pdf,video/mp4,video/webm"
      RATE_LIMITER_ENABLED: "true"
      RATE_LIMITER_POINTS: "300"
      RATE_LIMITER_DURATION: "60"
      DEFAULT_LANGUAGE: "tr-TR"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions

volumes:
  nizamlar_cms_pgdata:
    name: nizamlar_cms_pgdata
