# NİZAMLAR BASKI — PRODUCTION NGINX REVERSE PROXY
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff font/woff2;

    # Rate Limiting Bölgesi
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=quote_limit:10m rate=2r/s;

    # Upstream Tanımları
    upstream express_app {
        server app:3030;
        keepalive 32;
    }

    upstream directus_cms {
        server directus:8055;
        keepalive 32;
    }

    # HTTP -> HTTPS Yönlendirmesi
    server {
        listen 80;
        listen [::]:80;
        server_name nizamlarbaski.com www.nizamlarbaski.com;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Ana Sunucu
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name nizamlarbaski.com www.nizamlarbaski.com;

        # SSL Sertifikaları (Let's Encrypt / Cloudflare)
        ssl_certificate /etc/letsencrypt/live/nizamlarbaski.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nizamlarbaski.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Güvenlik Başlıkları
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 50M;

        # Directus Medya ve Yüklemeler (/assets/:id)
        location ~ ^/assets/([0-9a-f-]{36}|[0-9a-f-]{36}\.[a-z0-9]+)$ {
            proxy_pass http://directus_cms;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # Directus Yönetim Paneli & API (/admin, /auth, /items, /users vs.)
        location ~ ^/(admin|auth|items|files|collections|fields|relations|roles|permissions|activity|settings|users) {
            proxy_pass http://directus_cms;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Teklif Formu Rate Limitli API
        location = /api/quote {
            limit_req zone=quote_limit burst=5 nodelay;
            proxy_pass http://express_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Sürümlü Statik Varlıklar (Örn: /assets/js/main.js?v=xxx)
        location ~* ^/assets/(css|js|images|videos)/.+\.(css|js|svg|png|jpg|jpeg|webp|mp4|woff2)$ {
            proxy_pass http://express_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # Web Sitesi (Express Frontend)
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://express_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
