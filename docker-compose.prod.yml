# NİZAMLAR BASKI — FULL PRODUCTION DEPLOYMENT DOCKER COMPOSE
services:
  postgres:
    image: postgres:16-alpine
    container_name: nizamlar-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - nizamlar_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nizamlar_backend

  directus:
    image: directus/directus:12.5.0
    container_name: nizamlar-prod-directus
    restart: always
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_CLIENT: "pg"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      PUBLIC_URL: "https://nizamlarbaski.com"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "https://nizamlarbaski.com"
      CORS_METHODS: "GET,POST,PATCH,PUT,DELETE,OPTIONS"
      CORS_ALLOWED_HEADERS: "Content-Type,Authorization"
      CORS_CREDENTIALS: "true"
      SESSION_COOKIE_SECURE: "true"
      STORAGE_LOCATIONS: "local"
      STORAGE_LOCAL_ROOT: "/directus/uploads"
      STORAGE_LOCAL_DRIVER: "local"
      MAX_PAYLOAD_SIZE: "50mb"
      FILES_MAX_UPLOAD_SIZE: "50mb"
      DEFAULT_LANGUAGE: "tr-TR"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./cms/uploads:/directus/uploads
      - ./cms/extensions:/directus/extensions
    networks:
      - nizamlar_backend
      - nizamlar_frontend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nizamlar-prod-app
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3030
      DIRECTUS_URL: "http://directus:8055"
      DIRECTUS_SERVICE_TOKEN: ${DIRECTUS_SERVICE_TOKEN}
      PUBLIC_SITE_URL: "https://nizamlarbaski.com"
      TRUST_PROXY: "1"
    depends_on:
      - directus
    networks:
      - nizamlar_frontend

  nginx:
    image: nginx:alpine
    container_name: nizamlar-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
      - directus
    networks:
      - nizamlar_frontend

networks:
  nizamlar_backend:
    internal: true
  nizamlar_frontend:

volumes:
  nizamlar_prod_pgdata:
