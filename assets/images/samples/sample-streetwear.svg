<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b69" />
      <stop offset="100%" stop-color="#ff9f43" />
    </linearGradient>
  </defs>
  <!-- Frame -->
  <rect x="20" y="20" width="360" height="440" fill="#18191b" stroke="#ff3b69" stroke-width="2" rx="8" />
  <rect x="32" y="32" width="336" height="416" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  
  <!-- Header -->
  <text x="40" y="62" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ff3b69" letter-spacing="3">SECTION // 08-DTF</text>
  <text x="360" y="62" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f3efe7" text-anchor="end">2026</text>
  <line x1="32" y1="75" x2="368" y2="75" stroke="#ff3b69" stroke-width="1.5" />
  
  <!-- Center Graphic -->
  <g transform="translate(200, 210)">
    <circle cx="0" cy="0" r="90" fill="none" stroke="url(#neonPink)" stroke-width="4" />
    <circle cx="0" cy="0" r="70" fill="none" stroke="#f3efe7" stroke-width="1.5" stroke-dasharray="8,4" />
    <polygon points="0,-60 52,30 -52,30" fill="none" stroke="#f3efe7" stroke-width="3" />
    <circle cx="0" cy="2" r="16" fill="url(#neonPink)" />
    <!-- Crosshairs -->
    <line x1="-105" y1="0" x2="105" y2="0" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="0" y1="-105" x2="0" y2="105" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
  </g>
  
  <!-- Typography -->
  <text x="200" y="340" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="#f3efe7" text-anchor="middle" letter-spacing="6">CYBER APPAREL</text>
  <text x="200" y="365" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#ff9f43" text-anchor="middle" letter-spacing="3">HIGH ACCURACY INDUSTRIAL PRINT</text>
  <line x1="60" y1="385" x2="340" y2="385" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <text x="200" y="415" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ded9cf" text-anchor="middle" letter-spacing="2">ISTANBUL / WORLDWIDE LAB</text>
