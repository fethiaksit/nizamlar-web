<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <!-- Monogram Mark -->
  <g class="logo-mark">
    <rect x="4" y="8" width="48" height="48" rx="8" fill="#222325" stroke="#B29460" stroke-width="1.5"/>
    <path d="M16 44V20L32 38V20" stroke="#B29460" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M32 44V26L40 35" stroke="#F3EFE7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Subtle Print Dot Accent -->
    <circle cx="20" cy="16" r="2" fill="#B29460"/>
    <circle cx="28" cy="16" r="2" fill="#C9C1B5"/>
    <circle cx="36" cy="16" r="2" fill="#49372E"/>
  </g>
  <!-- Typography -->
  <g class="logo-text">
    <text x="64" y="32" font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" font-size="20" font-weight="800" letter-spacing="0.12em" fill="#222325">NİZAMLAR</text>
    <text x="202" y="32" font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" font-size="20" font-weight="300" letter-spacing="0.12em" fill="#B29460">BASKI</text>
    <text x="65" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.28em" fill="#49372E">TEKSTİL BASKI SANAYİ</text>
  </g>
</svg>
