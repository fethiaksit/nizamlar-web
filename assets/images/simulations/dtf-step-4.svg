<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" height="100%">
  <defs>
    <linearGradient id="powderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4d52" />
      <stop offset="100%" stop-color="#2a2c30" />
    </linearGradient>
    <linearGradient id="irTunnelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a1c18" />
      <stop offset="50%" stop-color="#4d1e16" />
      <stop offset="100%" stop-color="#3a1c18" />
    </linearGradient>
    <linearGradient id="heatGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4757" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ff7f50" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffa502" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Arka Plan -->
  <rect width="760" height="400" fill="#161718" rx="12" />
  <rect x="50" y="70" width="660" height="260" rx="8" fill="#222325" stroke="#b29460" stroke-width="1.5" />

  <!-- Konveyör Bant Hattı -->
  <rect x="80" y="220" width="600" height="12" fill="#18191a" stroke="#444" rx="2" />
  <line x1="80" y1="226" x2="680" y2="226" stroke="#b29460" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.6" />

  <!-- Transfer Film Şeridi (Bant üzerinde hareket eden) -->
  <rect x="100" y="212" width="560" height="8" rx="2" fill="rgba(255,255,255,0.75)" />
  <rect x="180" y="210" width="70" height="10" rx="1" fill="#00d2ff" opacity="0.8" />
  <rect x="330" y="210" width="70" height="10" rx="1" fill="#ffa502" opacity="0.8" />
  <rect x="500" y="210" width="70" height="10" rx="1" fill="#ff4757" opacity="0.9" />

  <!-- 1. Ünite: Otomatik Sıcak Tutkal Tozlama Haznesi (Powder Shaker Hopper) -->
  <g id="powderHopper">
    <rect x="130" y="90" width="160" height="40" rx="4" fill="url(#powderGrad)" stroke="#b29460" stroke-width="1.5" />
    <text x="210" y="115" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f3efe7" text-anchor="middle">HOTMELT TOZLAMA</text>
    
    <!-- Huni (Hopper funnel) -->
    <polygon points="150,130 270,130 230,175 190,175" fill="#32353a" stroke="#b29460" stroke-width="1.2" />
    
    <!-- Çalkalayıcı Titreşim Motoru İndikatörü -->
    <rect x="195" y="175" width="30" height="10" rx="2" fill="#b29460" />
    
    <!-- Yağan Termal Toz Parçacıkları (Adhesive TPU Granules) -->
    <g fill="#f3efe7" opacity="0.85">
      <circle cx="195" cy="192" r="1.5" />
      <circle cx="202" cy="196" r="1.8" />
      <circle cx="210" cy="190" r="1.5" />
      <circle cx="218" cy="195" r="1.7" />
      <circle cx="225" cy="191" r="1.5" />
      <circle cx="198" cy="202" r="1.6" />
      <circle cx="206" cy="205" r="1.5" />
      <circle cx="214" cy="201" r="1.8" />
      <circle cx="222" cy="204" r="1.6" />
    </g>

    <!-- Titreşim Frekans Dalgaları -->
    <path d="M 140 160 Q 145 165 140 170" fill="none" stroke="#ffa502" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 280 160 Q 275 165 280 170" fill="none" stroke="#ffa502" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- 2. Ünite: Kızılötesi (IR) Kürleme & Kurutma Tüneli (Curing Tunnel) -->
  <g id="curingTunnel">
    <rect x="360" y="105" width="290" height="110" rx="6" fill="url(#irTunnelGrad)" stroke="#ff4757" stroke-width="2" />
    
    <!-- IR Isıtıcı Rezistans Lambaları -->
    <line x1="385" y1="130" x2="625" y2="130" stroke="#ff4757" stroke-width="4" stroke-linecap="round" />
    <line x1="385" y1="150" x2="625" y2="150" stroke="#ffa502" stroke-width="4" stroke-linecap="round" />
    <line x1="385" y1="170" x2="625" y2="170" stroke="#ff4757" stroke-width="4" stroke-linecap="round" />
    
    <!-- Isı Işıması Alanı -->
    <rect x="375" y="125" width="260" height="60" fill="url(#heatGlow)" opacity="0.3" rx="4" />
    
    <!-- Sıcaklık Gösterge Paneli -->
    <rect x="450" y="185" width="110" height="22" rx="3" fill="#121314" stroke="#ff4757" stroke-width="1" />
    <text x="505" y="200" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ff4757" text-anchor="middle">135°C AKTİF</text>
  </g>

  <!-- Hareket Yönü Oku -->
  <path d="M 310 245 L 345 245 M 338 239 L 346 245 L 338 251" stroke="#b29460" stroke-width="2.5" stroke-linecap="round" />

  <!-- Açıklama ve Başlık -->
  <text x="380" y="295" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ff8e3c" text-anchor="middle">ADIM 4: TERMAL TOZLAMA &amp; KÜRLENME TÜNELİ</text>
  <text x="380" y="315" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#ded9cf" text-anchor="middle">Otomatik shaker ile TPU transfer tozu serpilir, 135°C IR tünelde polimerize edilir.</text>
</svg>
